include:
  - project: 'pedropilla/pipelines'
    ref: main
    file: '/ci-templates.yml'

variables:
  APP_NAME: "api-usermgmt"
  DOCKER_BUILD_PATH: "."
  ENVIRONMENT: "stg"

tests:
  extends: .go_tests
  tags:
  - k8s-gitlab-runner

build-docker-image:
  extends: .build-docker-image-template
  tags:
  - k8s-gitlab-runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-app:
  extends: .deploy-app-template
  variables:
    CONTEXT: "stg"
    KUSTOMIZE_DIR: "./kustomize/overlays/stg"
    KUBECONFIG: "~/.kube/config"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'