include:
  - project: 'pedropilla/pipelines'
    ref: main
    file: '/ci-templates.yml'

variables:
  APP_NAME: "api-usermgmt"
  DOCKER_BUILD_PATH: "."
  ENVIRONMENT: "prod"

tests:
  extends: .go_tests
  tags:
  - k8s-gitlab-runner

build-docker-image:
  extends: .build-docker-image-template
  tags:
  - k8s-gitlab-runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-app:
  extends: .deploy-app-template
  variables:
    CONTEXT: "prod"
    KUSTOMIZE_DIR: "./kustomize/overlays/prod"
    KUBECONFIG: "~/.kube/config"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

cypress:
  extends: .cypress-template
  variables:
    CYPRESS_BASE_URL: "https://api-usermgmt.fullstack.pw"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
