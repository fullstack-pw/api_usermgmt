name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
    docker-build-and-push:
      name: Build and Push App
      uses: fullstack-pw/pipelines/.github/workflows/build-and-push.yml@main
      with:
          app-context: "."
          app-name: "api-usermgmt"

    dev-deploy:
      needs: docker-build-and-push
      name: DEV deploy
      uses: fullstack-pw/pipelines/.github/workflows/deploy-kustomize.yml@main
      with:
        kustomize-dir: "kustomize/overlays/dev"
        context: "dev"
        app-name: api-usermgmt

    dev-cypress-tests:
      needs: dev-deploy
      name: DEV cypress
      uses: fullstack-pw/pipelines/.github/workflows/cypress.yml@main
      with:
        app-url: "https://dev.api-usermgmt.fullstack.pw"

    stg-deploy:
      needs: dev-cypress-tests
      name: STG deploy
      uses: fullstack-pw/pipelines/.github/workflows/deploy-kustomize.yml@main
      with:
        kustomize-dir: "kustomize/overlays/stg"
        context: "stg"
        app-name: api-usermgmt

    stg-cypress-tests:
      needs: stg-deploy
      name: STG cypress
      uses: fullstack-pw/pipelines/.github/workflows/cypress.yml@main
      with:
        app-url: "https://stg.api-usermgmt.fullstack.pw"

    prod-deploy:
      needs: stg-cypress-tests
      name: PROD deploy
      uses: fullstack-pw/pipelines/.github/workflows/deploy-kustomize.yml@main
      with:
        kustomize-dir: "kustomize/overlays/prod"
        context: "prod"
        app-name: api-usermgmt

    prod-cypress-tests:
      needs: prod-deploy
      name: PROD cypress
      uses: fullstack-pw/pipelines/.github/workflows/cypress.yml@main
      with:
        app-url: "https://api-usermgmt.fullstack.pw"